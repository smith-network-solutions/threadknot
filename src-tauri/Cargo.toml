[package]
name = "threadknot"
version = "0.1.0"
edition = "2021"
description = "Threadknot — every coding agent on one thread"
authors = ["Spencer Smith"]
default-run = "threadknot"

[lib]
name = "threadknot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "fs",
    "compression-br",
    "compression-gzip",
] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
thiserror = "2"
dirs = "6"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
local-ip-address = "0.6"
which = "7"
notify-rust = "4"
portable-pty = "0.9.0"
chromiumoxide = "0.9"
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
gethostname = "1"
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
mdns-sd = "0.13"
urlencoding = "2"
# QR rendering for phone pairing. SVG only — the `image` feature would drag in
# the whole `image` crate to produce a raster we never use.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
strip = true
lto = true
