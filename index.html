<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the
         LAYOUT viewport, so 100dvh and the bottom-anchored composer both land
         above it instead of behind it. Chrome/Android honours this; iOS ignores
         it and only shrinks the visual viewport, which installKeyboardInset()
         (src/lib/viewport.ts) measures and publishes as --kb-inset. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Threadknot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
