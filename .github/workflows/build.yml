name: build

# Manual only, deliberately. This workflow builds a Tauri app on three runners,
# and nothing about an ordinary push needs that: the real verify gate runs
# locally (`cargo clippy`, `cargo test`, `npm run build`) before anything is
# pushed. Do NOT add a `push:` or `pull_request:` trigger back — a CI run should
# be something you asked for.
#
# To cut a release, dispatch this against the tag rather than pushing the tag and
# hoping: `gh workflow run build.yml --ref vX.Y.Z`. `github.ref` is then
# `refs/tags/vX.Y.Z`, so the release job below still recognises it.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      # Full history, NOT the default shallow clone. `build.rs` derives
      # THREADKNOT_VERSION from `git rev-list --count origin/master`, and the
      # app's whole update story rests on that number: a depth-1 checkout
      # produces "0.1.1", which every installed copy then reads as a version
      # older than its own and never updates to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Tauri's Linux system libraries (webkit webview, tray, icons).
      - name: Install Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps + frontend typecheck
        run: |
          npm ci
          npm run build

      # Bundle filenames carry this version, and the in-app updater picks the
      # artifact for a machine by reading them — so on a tag it has to be the
      # tag rather than the placeholder in the tree. Deliberately after `npm ci`
      # (which refuses a package.json out of step with the lockfile) and before
      # the bundle step that reads it. Cargo.toml is untouched: `--locked` would
      # reject the lockfile it invalidates, and the running app takes its
      # version from git, not from there.
      - name: Stamp the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
              const doc = JSON.parse(fs.readFileSync(file, "utf8"));
              doc.version = version;
              fs.writeFileSync(file, JSON.stringify(doc, null, 2) + "\n");
            }
            console.log("bundling as " + version);
          ' "${GITHUB_REF_NAME#v}"

      # The GUI app MUST be built via the Tauri CLI so the frontend is embedded.
      # A bare `cargo build` produces a binary that loads the dev server (devUrl)
      # and shows "localhost refused to connect".
      # The .dmg is the one-click macOS download on the Releases page. Unsigned CI
      # builds are ad-hoc signed; Gatekeeper will still warn on first open until
      # Developer ID signing + notarization secrets are added (APPLE_CERTIFICATE,
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID,
      # APPLE_PASSWORD, APPLE_TEAM_ID) — Tauri picks them up automatically.
      - name: Build GUI app + dmg (Tauri, macOS)
        if: matrix.name == 'macos'
        run: npx tauri build --bundles app,dmg -- --locked

      # Windows toast notifications require an installed application whose
      # AppUserModelID is registered by the Start Menu shortcut. A portable
      # target/release/threadknot.exe cannot provide reliable native toasts.
      - name: Build GUI app + installer (Tauri, Windows)
        if: matrix.name == 'windows'
        run: npx tauri build --bundles nsis -- --locked

      # Linux bundles deb + rpm installers plus a portable AppImage — the
      # download-and-run option for every distro (Arch included).
      - name: Build GUI app + packages (Tauri, Linux)
        if: matrix.name == 'linux'
        run: npx tauri build --bundles deb,rpm,appimage -- --locked

      - name: Build headless server
        working-directory: src-tauri
        run: cargo build --release --locked --bin threadknot-headless

      - name: Upload Windows binaries
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: threadknot-windows
          path: |
            src-tauri/target/release/threadknot.exe
            src-tauri/target/release/threadknot-headless.exe
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload macOS binaries
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: threadknot-macos
          path: |
            src-tauri/target/release/threadknot
            src-tauri/target/release/threadknot-headless
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Linux binaries
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: threadknot-linux
          path: |
            src-tauri/target/release/threadknot
            src-tauri/target/release/threadknot-headless
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  # Tagging `vX.Y.Z` publishes the matrix's artifacts as a GitHub Release, so
  # people can run Threadknot without a Rust toolchain. CI artifacts alone
  # expire in 90 days and require a logged-in GitHub account to download.
  #
  # This release is also what the app's own updater installs, so two things
  # about it are load-bearing and neither is cosmetic:
  #
  #  - **The tag is `v0.1.<commit count of master>`** — the same number
  #    `build.rs` bakes into the binary. `scripts/release.sh` computes it; do
  #    not hand-pick one. A tag lower than the count means every installed copy
  #    concludes it is already newer and stops updating, permanently.
  #  - **Artifact filenames carry the version and the architecture**, because
  #    `update.rs` picks the one to download by reading them. A release with two
  #    unlabelled builds for one platform installs on neither.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Bare binaries collide across platforms (both macOS and Linux produce
      # `threadknot`), so flatten with a platform suffix before uploading.
      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p out
          for os in linux macos windows; do
            d="artifacts/threadknot-$os"
            [ -d "$d" ] || continue
            find "$d" -type f | while read -r f; do
              base="$(basename "$f")"
              case "$base" in
                *.deb|*.rpm|*.exe|*.dmg|*.AppImage)
                  # Installers already carry version/arch in their filename,
                  # except the NSIS stub — keep them as-is unless they clash.
                  if [ -e "out/$base" ]; then base="${base%.*}-$os.${base##*.}"; fi
                  cp "$f" "out/$base" ;;
                *)
                  cp "$f" "out/$base-$os" ;;
              esac
            done
          done
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
